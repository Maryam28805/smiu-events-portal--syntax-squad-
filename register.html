    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">SMIU Events</a>

            <span class="navbar-toggler-icon"></span>

<!-- Heading -->
<header class="bg-primary text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Event Registration</h1>
        <p class="lead">Register now and become part of exciting university events!</p>
    </div>
</header>

<!-- Registration Form -->
<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Student Registration Form</h2>

                <form action="#" method="post">

                    <div class="row g-3">

                        <!-- Name -->
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="fullName" placeholder="Enter your full name" required>
                        </div>

                        <!-- Roll Number -->
                        <div class="col-md-6">
                            <label for="roll" class="form-label">Roll Number *</label>
                            <input type="text" class="form-control" id="roll" name="rollNumber" placeholder="Enter roll number" required>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="03XXXXXXXXX" required>
                        </div>

                        <!-- Department -->
                        <div class="col-md-6">
                            <label for="department" class="form-label">Department *</label>
                            <select class="form-select" name="department" id="department" required>
                                <option value="">Select Department</option>
                                <option>Computer Science</option>
                                <option>Software Engineering</option>
                                <option>Business Administration</option>
                                <option>Media Sciences</option>
                                <option>Education</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <!-- Event -->
                        <div class="col-md-6">
                            <label for="event" class="form-label">Select Event *</label>
                            <select class="form-select" name="event" id="event" required>
                                <option value="">Choose an Event</option>
                                <option>Tech Fest 2026</option>
                                <option>Sports Gala 2026</option>
                                <option>Annual Cultural Day</option>
                                <option>Art Exhibition</option>
                                <option>Career Fair</option>
                            </select>
                        </div>

                        <!-- Year -->
                        <div class="col-12">
                            <label class="form-label">Academic Year *</label><br>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="year" id="year1" value="1st" required>
                                <label class="form-check-label" for="year1">1st Year</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="year" id="year2" value="2nd">
                                <label class="form-check-label" for="year2">2nd Year</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="year" id="year3" value="3rd">
                                <label class="form-check-label" for="year3">3rd Year</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="year" id="year4" value="4th">
                                <label class="form-check-label" for="year4">4th Year</label>
                            </div>
                        </div>

                        <!-- Interests -->
                        <div class="col-12">
                            <label class="form-label">Your Interests</label>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="sports" value="Sports" name="interests[]">
                                <label class="form-check-label" for="sports">Sports</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="technology" value="Technology" name="interests[]">
                                <label class="form-check-label" for="technology">Technology</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="arts" value="Arts" name="interests[]">
                                <label class="form-check-label" for="arts">Arts and Creativity</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="social" value="Social Activities" name="interests[]">
                                <label class="form-check-label" for="social">Social Activities</label>
                            </div>
                        </div>

                        <!-- Message -->
                        <div class="col-12">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="4" name="message" placeholder="Write your message here..."></textarea>
                        </div>

                        <!-- Terms -->
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the terms and conditions.
                                </label>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="col-12 text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="bi bi-send-fill"></i> Submit Registration
                            </button>
                        </div>

                    </div>
                </form>
            </div>

        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-4">

</html>
